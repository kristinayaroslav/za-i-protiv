<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>За и против</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe6f3; --ink:#3a1f4a; --soft:#7a6585; --card:#fbf7fc;
    --green:#8fc7a0; --yellow:#f1c76a; --red:#e48a8a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,system-ui,sans-serif;
    display:flex; flex-direction:column; padding:2vh 3vw; gap:2vh;
  }
  header{display:flex; justify-content:space-between; align-items:baseline}
  h1{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:clamp(28px,4.5vw,64px); margin:0; letter-spacing:-.01em}
  .counter{color:var(--soft); font-size:clamp(14px,1.6vw,22px)}
  .thesis{
    font-family:"Cormorant Garamond",serif; font-weight:500;
    font-size:clamp(26px,4vw,56px); line-height:1.12;
    background:var(--card); border-radius:28px; padding:3vh 3vw;
    min-height:20vh; display:flex; align-items:center;
  }
  .cols{flex:1; display:grid; grid-template-columns:repeat(2,1fr); gap:2vw; min-height:0}
  .col{display:flex; flex-direction:column; gap:1.5vh; min-height:0}
  .barwrap{flex:1; background:var(--card); border-radius:28px; display:flex; align-items:flex-end; overflow:hidden; min-height:18vh}
  .bar{width:100%; height:0; transition:height .45s cubic-bezier(.2,.9,.3,1); display:flex; justify-content:center; align-items:flex-start}
  .num{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:clamp(40px,7vw,110px); line-height:1; padding-top:1vh; color:var(--ink)}
  .g .bar{background:var(--green)} .y .bar{background:var(--yellow)} .r .bar{background:var(--red)}
  .label{text-align:center; font-weight:600; font-size:clamp(16px,2vw,28px)}
  .btns{display:flex; gap:1vw}
  button{
    font:inherit; border:0; border-radius:20px; cursor:pointer;
    padding:1.6vh 1vw; background:var(--card); color:var(--ink);
    font-size:clamp(18px,2.2vw,30px); font-weight:600;
  }
  button:active{transform:scale(.97)}
  .add{flex:1} .g .add{background:var(--green)} .y .add{background:var(--yellow)} .r .add{background:var(--red)}
  .minus{width:22%}
  footer{display:flex; gap:1vw; justify-content:space-between}
  footer button{flex:1}
  .hint{color:var(--soft); text-align:center; font-size:clamp(12px,1.2vw,16px)}
  #summary{
    position:fixed; inset:0; background:var(--bg); padding:4vh 4vw; overflow:auto; display:none;
  }
  #summary.on{display:block}
  #summary h2{font-family:"Cormorant Garamond",serif; font-size:clamp(30px,4.5vw,64px); margin:0 0 2vh}
  .row{background:var(--card); border-radius:22px; padding:2vh 2vw; margin-bottom:1.5vh}
  .row p{margin:0 0 1vh; font-size:clamp(16px,1.8vw,24px); font-weight:600}
  .strip{display:flex; height:3.2vh; border-radius:99px; overflow:hidden; background:#e3d8e8}
  .strip i{display:block; height:100%; transition:width .4s}
  .strip .a{background:var(--green)} .strip .b{background:var(--yellow)} .strip .c{background:var(--red)}
  .vals{margin-top:.8vh; color:var(--soft); font-size:clamp(13px,1.3vw,18px)}

  #rows{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr)); gap:1.5vh 1.5vw}
  #rows .row{margin:0}
  #rows .row.top{grid-column:1/-1; text-align:center}
  .see{width:100%; max-width:520px; display:block; margin:0 auto}
  .top .see{max-width:640px}
  .see .plank{transform-origin:200px 120px; transition:transform 1.1s cubic-bezier(.3,1.5,.5,1)}
  .see text{font-family:"Cormorant Garamond",serif; font-weight:700; fill:#3a1f4a; text-anchor:middle; dominant-baseline:central}
  .see .cap{font-family:Inter,sans-serif; font-weight:600; font-size:13px; fill:#7a6585}
  .row .big{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:clamp(26px,3vw,44px); margin:0}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>За и против</h1>
  <div class="counter" id="counter"></div>
</header>

<div class="thesis" id="thesis"></div>

<div class="cols">
  <div class="col g">
    <div class="barwrap"><div class="bar" id="bar0"><span class="num" id="n0">0</span></div></div>
    <div class="label">За</div>
    <div class="btns"><button class="minus" id="m0" aria-label="убрать голос за">−</button><button class="add" id="a0">+ 1</button></div>
  </div>
  <div class="col r">
    <div class="barwrap"><div class="bar" id="bar1"><span class="num" id="n1">0</span></div></div>
    <div class="label">Против</div>
    <div class="btns"><button class="minus" id="m1" aria-label="убрать голос против">−</button><button class="add" id="a1">+ 1</button></div>
  </div>
</div>

<footer>
  <button id="prev">Назад</button>
  <button id="next">Следующий тезис</button>
  <button id="done">Итоги</button>
</footer>
<div class="hint">Клавиши: 1 — за, 2 — против; стрелки — тезисы; Backspace — убрать последний голос</div>

<section id="summary">
  <h2>Итоги</h2>
  <div id="rows"></div>
  <button id="back">Вернуться</button>
</section>

<script>
// Тезисы можно менять прямо здесь, по одному на строку.
const THESES = [
  "Ругаться на нейросеть можно: она не человек и не обидится.",
  "Лучше выплеснуть злость на нейросеть, чем на близких.",
  "Правильно, что нейросеть может прервать разговор, если на неё грубят.",
  "Вдруг нейросети когда-нибудь станет обидно? Тогда грубить ей нельзя.",
  "Когда я грублю нейросети, я становлюсь грубее и с людьми."
];
const $ = id => document.getElementById(id);
let i = 0;
const votes = THESES.map(() => [0,0]);
const history = THESES.map(() => []); // порядок голосов для отмены

function render(){
  $('thesis').textContent = THESES[i];
  $('counter').textContent = "Тезис " + (i+1) + " из " + THESES.length;
  const v = votes[i];
  const max = Math.max(1, ...v);
  v.forEach((n, k) => {
    $('n'+k).textContent = n;
    // высота колонки пропорциональна наибольшему значению, минимум 12% чтобы число читалось
    $('bar'+k).style.height = n === 0 ? "12%" : (12 + 88 * n / max) + "%";
  });
  $('prev').disabled = i === 0;
  $('next').disabled = i === THESES.length - 1;
}
function add(k){ votes[i][k]++; history[i].push(k); render(); }
function minus(k){
  if (votes[i][k] > 0){
    votes[i][k]--;
    const idx = history[i].lastIndexOf(k);
    if (idx > -1) history[i].splice(idx,1);
    render();
  }
}
function undo(){
  const k = history[i].pop();
  if (k !== undefined){ votes[i][k]--; render(); }
}
function verdict(v){
  const sum = v[0]+v[1];
  if (!sum) return "Голосов нет";
  const hi = Math.max(v[0],v[1]) / sum, side = v[0] >= v[1] ? "за" : "против";
  if (v[0] === v[1]) return "Поровну";
  if (hi === 1) return "Единодушно " + side;
  if (hi >= 0.7) return "Явное большинство " + side;
  if (hi >= 0.6) return "Небольшой перевес " + side;
  return "Мнения разделились";
}
function seesaw(f, a){
  const sum = f + a, NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 400 208"); svg.setAttribute("class", "see");
  const rf = 24 + (sum ? 16 * f / sum : 0), ra = 24 + (sum ? 16 * a / sum : 0);
  svg.innerHTML =
    '<polygon points="200,120 168,172 232,172" fill="#c9b6d4"/>' +
    '<rect x="150" y="172" width="100" height="6" rx="3" fill="#c9b6d4"/>' +
    '<g class="plank" style="transform:rotate(0deg)">' +
      '<rect x="30" y="116" width="340" height="8" rx="4" fill="#3a1f4a"/>' +
      '<circle cx="62" cy="' + (116 - rf) + '" r="' + rf + '" fill="#8fc7a0"/>' +
      '<text x="62" y="' + (116 - rf) + '" font-size="' + (rf*1.1) + '">' + f + '</text>' +
      '<circle cx="338" cy="' + (116 - ra) + '" r="' + ra + '" fill="#e48a8a"/>' +
      '<text x="338" y="' + (116 - ra) + '" font-size="' + (ra*1.1) + '">' + a + '</text>' +
    '</g>' +
    '<text class="cap" x="62" y="196" style="font-size:16px">За</text><text class="cap" x="338" y="196" style="font-size:16px">Против</text>';
  const angle = sum ? Math.max(-16, Math.min(16, (a - f) / sum * 16)) : 0;
  // sign: heavier side goes down; against on the right -> clockwise (positive) when a > f
  setTimeout(() => { const g = svg.querySelector('.plank'); if (g) g.style.transform = 'rotate(' + angle + 'deg)'; }, 80);
  return svg;
}
function summary(){
  const rows = $('rows'); rows.innerHTML = "";
  let totalFor = 0, totalAgainst = 0, spicy = -1, spicyGap = 2, agree = -1, agreeGap = -1;
  THESES.forEach((t, idx) => {
    const v = votes[idx], sum = v[0]+v[1];
    totalFor += v[0]; totalAgainst += v[1];
    if (sum){
      const gap = Math.abs(v[0]-v[1]) / sum;
      if (gap < spicyGap){ spicyGap = gap; spicy = idx; }
      if (gap > agreeGap){ agreeGap = gap; agree = idx; }
    }
  });
  const totalAll = totalFor + totalAgainst;
  const top = document.createElement('div'); top.className = 'row top';
  const h = document.createElement('p'); h.className = 'big';
  if (!totalAll){ h.textContent = "Голосов пока нет."; top.appendChild(h); }
  else {
    const pf = Math.round(100 * totalFor / totalAll);
    h.textContent = "Всего голосов: " + totalAll + ". За " + pf + "%, против " + (100 - pf) + "%.";
    top.append(h, seesaw(totalFor, totalAgainst));
    const a = document.createElement('div'); a.className = 'vals';
    a.textContent = "Самый спорный тезис: " + (spicy+1) + ".  Самый единодушный: " + (agree+1) + ".";
    top.appendChild(a);
  }
  rows.appendChild(top);
  THESES.forEach((t, idx) => {
    const v = votes[idx], sum = v[0]+v[1];
    const pct = x => sum ? Math.round(100*x/sum) : 0;
    const el = document.createElement('div'); el.className = 'row';
    const p = document.createElement('p'); p.textContent = (idx+1) + ". " + t;
    const vals = document.createElement('div'); vals.className = 'vals';
    vals.textContent = sum ? verdict(v) + ".  " + pct(v[0]) + "% за, " + pct(v[1]) + "% против" : "Голосов нет";
    el.append(p, seesaw(v[0], v[1]), vals); rows.appendChild(el);
  });
  $('summary').classList.add('on');
}
[0,1].forEach(k => { $('a'+k).onclick = () => add(k); $('m'+k).onclick = () => minus(k); });
$('next').onclick = () => { if (i < THESES.length-1){ i++; render(); } };
$('prev').onclick = () => { if (i > 0){ i--; render(); } };
$('done').onclick = summary;
$('back').onclick = () => $('summary').classList.remove('on');
document.addEventListener('keydown', e => {
  if ($('summary').classList.contains('on')) { if (e.key === 'Escape') $('summary').classList.remove('on'); return; }
  if (e.key === '1') add(0);
  else if (e.key === '2') add(1);
  else if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();
  else if (e.key === 'Backspace') undo();
});
render();
</script>
</body>
</html>
